[[IgnoredVulns]]
id = "GHSA-4g3v-8h47-v7g6"
reason = """
Affects astro <7.1.0. The project pins astro to the 6.x line; upgrading to
astro 7.x requires a separate, breaking migration effort beyond the scope of
this security-bump PR. The vulnerability (CVSS 5.3, Medium) is in the
static-site build toolchain and has no user-facing runtime exposure.
"""

